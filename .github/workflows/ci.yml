name: CI

# pull_request is unfiltered: stacked PRs (based on other feature branches)
# must run CI too.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; master
    # jobs must opt into it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build tests
        run: nix build '.#tests'

      - name: Run qt-sdk tests
        run: ./result/bin/qt_sdk_tests
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build logos-qt-generator
        run: nix build '.#logos-qt-generator' -o result-qtgen

      - name: Smoke the generator
        run: ./result-qtgen/bin/logos-qt-generator 2>&1 | grep -q Usage
